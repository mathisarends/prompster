[project]
name = "llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mathisarends", email = "mathisarends27@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "py-llmify[openai]>=0.4.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src/llm"]