[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mathisarends" }
]
requires-python = ">=3.14"
dependencies = [
    "agent",
    "dishka>=1.10.1",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "uvicorn[standard]>=0.35.0",
    "obstore>=0.11.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlmodel>=0.0.38",
    "alembic>=1.18.4",
    "PyJWT>=2.10.1",
    "cryptography>=45.0.7",
    "spotifyify==0.9.0",
    "typst>=0.14.9",
    "qrcode[pil]>=8.2",
    "tokenary>=0.1.1",
    "python-multipart>=0.0.20",
    "fastapi-canon[websockets]>=0.24.0",
    "callm @ git+https://github.com/mathisarends/callm.git@982472f056789d0cbd5a878a15f77e5fbde6f334",
    "pyyaml>=6.0.3",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi-canon[codegen]>=0.24.0",
    "httpx2>=2.16.0,<3",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=src/backend",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/backend"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.uv.sources]
agent = { workspace = true }
