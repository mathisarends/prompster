[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mathisarends", email = "mathisarends27@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dishka>=1.10.1",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "uvicorn>=0.35.0",
    "py-llmify[openai]>=0.3.0",
    "aioboto3>=13.3.0",
    "types-aiobotocore-s3>=2.15.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlmodel>=0.0.38",
    "alembic>=1.18.4",
    "PyJWT>=2.10.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
