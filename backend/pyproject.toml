[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mathisarends", email = "mathisarends27@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "agent",
    "llm",
    "dishka>=1.10.1",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "uvicorn>=0.35.0",
    "obstore>=0.11.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlmodel>=0.0.38",
    "alembic>=1.18.4",
    "PyJWT>=2.10.1",
    "cryptography>=45.0.7",
    "spotifyify>=0.8.0",
    "resend>=2.30.1",
    "typst>=0.14.9",
    "qrcode[pil]>=8.2",
    "tokenary>=0.1.1",
    "python-multipart>=0.0.20",
    "fastapi-canon>=0.1.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
agent = { workspace = true }
llm = { workspace = true }
