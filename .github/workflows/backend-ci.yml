name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "libs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "smelt.yml"
      - ".pre-commit-config.yaml"
      - ".smelt/**"
      - "codegen.toml"
      - "schema/**"
      - "frontend/src/api/session-streams/**"
      - "frontend/openapi.json"
      - "frontend/scripts/export-openapi.py"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "libs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "smelt.yml"
      - ".pre-commit-config.yaml"
      - ".smelt/**"
      - "codegen.toml"
      - "schema/**"
      - "frontend/src/api/session-streams/**"
      - "frontend/openapi.json"
      - "frontend/scripts/export-openapi.py"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prompster
          POSTGRES_DB: prompster
          # A throwaway database for migration checks; no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U prompster"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URI: postgresql+asyncpg://prompster@localhost:5432/prompster

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Check architecture and conventions
        run: uvx --python 3.14 --from smelt-cli==0.18.0 smelt check --strict-coverage --fail-on warning --format github

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Run backend tests
        run: uv run pytest backend/tests/ -v

      - name: Run agent tests
        run: uv run --package agent pytest libs/agent/tests/ -v

      - name: Check composition
        run: uv run --package backend fastapi-canon check composition --app backend.main:app --fail-on warning

      - name: Apply migrations to an empty database
        run: uv run --package backend fastapi-canon db --config backend/pyproject.toml upgrade head

      - name: Check migrations against the models
        run: uv run --package backend fastapi-canon db --config backend/pyproject.toml check

      - name: Check stream contract and client
        run: uv run --package backend fastapi-canon generate --config codegen.toml --check

      - name: Check OpenAPI document
        run: uv run --package backend python frontend/scripts/export-openapi.py --check
