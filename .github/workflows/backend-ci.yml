name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "libs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "smelt.yml"
      - ".smelt/**"
      - "codegen.toml"
      - "schema/**"
      - "frontend/src/api/session-streams/**"
      - "frontend/openapi.json"
      - "frontend/scripts/export-openapi.py"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "libs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "smelt.yml"
      - ".smelt/**"
      - "codegen.toml"
      - "schema/**"
      - "frontend/src/api/session-streams/**"
      - "frontend/openapi.json"
      - "frontend/scripts/export-openapi.py"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Check architecture and conventions
        run: uvx --python 3.14 --from smelt-cli==0.16.1 smelt check --strict-coverage --fail-on warning --format github

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Run tests
        run: uv run pytest backend/tests/ -v

      - name: Check stream contract and client
        run: uv run --package backend fastapi-canon generate --config codegen.toml --check

      - name: Check OpenAPI document
        run: uv run --package backend python frontend/scripts/export-openapi.py --check
