[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mathisarends" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "spotifyify==0.9.0",
    "tokenary>=0.1.1",
    "harnessed[openai] @ git+https://github.com/mathisarends/harnessed.git@65d772032aad3e1f4318abd98d12366f323e8aca",
    "pydantic-ai-slim[openai]>=2.71.0",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
