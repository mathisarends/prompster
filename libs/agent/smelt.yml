architecture:
  layers:
    foundation:
      modules: [agent.markup, agent.prompts]
      may_depend_on: []
    capabilities:
      modules:
        - agent.activity
        - agent.conversation
        - agent.deck
        - agent.onboarding
        - agent.research
        - agent.review
      may_depend_on: [foundation]
    runtime:
      modules: [agent.agent, agent.events]
      may_depend_on: [foundation, capabilities]
  packages:
    agent-api:
      match: agent
      public: ['.', activity, conversation, deck, onboarding, research, review]
      min_importers_to_export: 3
      test_access: mirrored
rules:
  architecture/missing-facade-export: error
debt: .smelt/debt.json
