architecture:
  layers:
    foundation:
      modules: [agent.deck, agent.views]
      may_depend_on: []
    messages:
      modules: [agent.messages]
      may_depend_on: [foundation]
    capabilities:
      modules: [agent.guardrails, agent.tools]
      may_depend_on: [foundation, messages]
    runtime:
      modules: [agent.agent, agent.events, agent.plugins]
      may_depend_on: [foundation, messages, capabilities]
  packages:
    agent-api:
      match: agent
      public: ['.', deck, messages]
      min_importers_to_export: 3
rules:
  architecture/missing-facade-export: error
debt: .smelt/debt.json
