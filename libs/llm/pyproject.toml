[project]
name = "llm"
version = "0.1.0"
description = "Provider-neutral chat model ports with OpenAI API key and Codex subscription adapters."
readme = "README.md"
authors = [
    { name = "mathisarends" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-ai-slim[openai]>=2.43.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
