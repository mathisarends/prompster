[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mathisarends", email = "mathisarends27@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "agentory[openai]>=0.4.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "spotifyify>=0.2.0",
    "typst>=0.14.8",
]

[project.scripts]
agent = "agent:main"

[build-system]
