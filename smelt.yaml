# Architecture guardrails for smelt. Reference: `smelt config schema`,
# rule details: `smelt explain <rule>`.
version: 1

# Where the code is.
project:
  source_roots: [backend/src, libs/agent/src, libs/tokens/src]
  # root_packages: [backend, agent, tokens]  # discovered from source_roots
  test_roots: [backend/tests, libs/agent/tests]
  # exclude: ["**/migrations/**"]

# What shape the code has: which imports are allowed, where concepts live.
architecture:
  features:
    root: backend.features  # every direct child package is a feature
  layers:
    domain:
      path: domain
      may_depend_on: []
    application:
      path: application
      may_depend_on: [domain]
    infrastructure:
      path: infrastructure
      may_depend_on: [domain, application]
    presentation:
      path: presentation
      may_depend_on: [application, domain]
  shared: [backend.shared]  # importable everywhere; must not import features
  composition_root: [backend.main, backend.lifespan]
  cross_feature:
    default: deny
    allow:
      # auth.presentation provides the current-user dependency for every router
      - {from: session.presentation, to: auth.presentation}
      - {from: oauth_connections.presentation, to: auth.presentation}
      - {from: spotify.presentation, to: auth.presentation}
      - {from: user.presentation, to: auth.presentation}
      # use cases collaborating across features
      - {from: auth.application, to: user.domain}
      - {from: auth.application, to: oauth_connections.application}
      - {from: user.application, to: auth.application}
      - {from: session.application, to: user.domain}
      - {from: session.application, to: oauth_connections.application}
      - {from: session.application, to: spotify.application}
      - {from: session.presentation, to: spotify.application}
  # Roles give concepts a canonical home (`smelt context` lists them).
  # roles:
  #   port:
  #     detect: { base: typing.Protocol }
  #     layers: [application]
  #     file: ports.py
  #   adapter:
  #     detect: { implements: port }
  #     layers: [infrastructure]

# How code is named, placed and tested.
conventions:
  naming:
    forbidden: [utils, helpers]
  tests:
    layout: none  # mirror | feature | none

# Where a framework gets special treatment.
integrations:
  dependency_injection:  # always allowed in the composition root
    frameworks: [dishka]
    allowed_in:  # modules (and their submodules) keep their feature/layer
      - "backend.features.*.infrastructure.di"
      - backend.infrastructure.database.provider
      - backend.infrastructure.di

# How loud a finding is, by rule name or code: error | warning | hint | off
# rules:
#   crowded-package: off

# Adopting and silencing findings; `smelt debt` records today's violations.
# findings:
#   debt: .smelt/debt.json
