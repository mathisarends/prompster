services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prompster-backend
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      RELOAD: ${RELOAD:-true}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://127.0.0.1:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8000/api/v1/auth/google/callback}
      DB_URI: ${DB_URI:-postgresql+asyncpg://${POSTGRES_USER:-prompster}:${POSTGRES_PASSWORD:-prompster}@postgres:5432/${POSTGRES_DB:-prompster}}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-prompster}
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT_URL: ${MINIO_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      SPOTIFY_TOKEN_ENCRYPTION_KEY: ${SPOTIFY_TOKEN_ENCRYPTION_KEY:-}
    volumes:
      - ./backend/src:/app/backend/src
      - ./llm/src:/app/llm/src
      - ./agent/src:/app/agent/src
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prompster-migrate
    restart: on-failure
    environment:
      DB_URI: ${DB_URI:-postgresql+asyncpg://${POSTGRES_USER:-prompster}:${POSTGRES_PASSWORD:-prompster}@postgres:5432/${POSTGRES_DB:-prompster}}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        attempts=0
        until alembic -c /app/backend/alembic.ini upgrade head; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 20 ]; then
            echo "Migration failed after $$attempts attempts."
            exit 1
          fi
          echo "Migration attempt $$attempts failed. Retrying in 3s..."
          sleep 3
        done

  postgres:
    image: postgres:16-alpine
    container_name: prompster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prompster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prompster}
      POSTGRES_DB: ${POSTGRES_DB:-prompster}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prompster}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: prompster-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: prompster-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  minio-init:
    image: minio/mc:latest
    container_name: prompster-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-prompster}
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && (mc mb -p "local/$$STORAGE_BUCKET_NAME" || true)

volumes:
  postgres_data:
  minio_data:
