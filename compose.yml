services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prompster-backend
    restart: unless-stopped
    environment:
      ENV: ${ENV:-dev}
      PYDANTIC_AI_NO_BANNER: "1"
      RELOAD: ${RELOAD:-true}
      LOG_LEVEL: ${LOG_LEVEL:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://127.0.0.1:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://127.0.0.1:8000/api/v1/auth/google/callback}
      DB_URI: ${DB_URI:-postgresql+asyncpg://${POSTGRES_USER:-prompster}:${POSTGRES_PASSWORD:-prompster}@postgres:5432/${POSTGRES_DB:-prompster}}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-prompster}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://seaweedfs:8333}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://127.0.0.1:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-prompster}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-prompster-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      SPOTIFY_TOKEN_ENCRYPTION_KEY: ${SPOTIFY_TOKEN_ENCRYPTION_KEY:-}
    volumes:
      - ./backend/src:/app/backend/src
      - ./libs/agent/src:/app/libs/agent/src
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prompster-migrate
    restart: on-failure
    environment:
      DB_URI: ${DB_URI:-postgresql+asyncpg://${POSTGRES_USER:-prompster}:${POSTGRES_PASSWORD:-prompster}@postgres:5432/${POSTGRES_DB:-prompster}}
    volumes:
      - ./backend/src:/app/backend/src
      - ./backend/migrations:/app/backend/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        attempts=0
        until fastapi-canon db --config /app/backend/pyproject.toml upgrade head; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 20 ]; then
            echo "Migration failed after $$attempts attempts."
            exit 1
          fi
          echo "Migration attempt $$attempts failed. Retrying in 3s..."
          sleep 3
        done

  postgres:
    image: postgres:16-alpine
    container_name: prompster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prompster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prompster}
      POSTGRES_DB: ${POSTGRES_DB:-prompster}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prompster}"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    container_name: prompster-seaweedfs
    restart: unless-stopped
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-prompster}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-prompster-secret}
      S3_BUCKET: ${STORAGE_BUCKET_NAME:-prompster}
      WEED_ADMIN_USER: ${S3_ACCESS_KEY:-prompster}
      WEED_ADMIN_PASSWORD: ${S3_SECRET_KEY:-prompster-secret}
    ports:
      - "8333:8333" # S3 API
      - "12535:12535" # Admin UI
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: prompster-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  seaweedfs_data:
