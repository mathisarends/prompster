repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: smelt-staged
        name: smelt
        entry: smelt check --staged --strict-coverage --fail-on warning
        language: python
        language_version: "3.14"
        additional_dependencies: [smelt-cli==0.20.0]
        pass_filenames: false
        always_run: true
        require_serial: true
